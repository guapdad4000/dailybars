    <title>DAILY RAPS | GUAPDAD 4000</title>

    <script>
        (function () {
            console.log('🐉 Debug watchers armed');
            const captureResourceError = (event) => {
                const target = event.target || event.srcElement;
                if (!target) return;
                const resource = target.src || target.href;
                if (resource) {
                    console.log('🚨 Resource failed:', resource);
                }
            };

            window.addEventListener('error', captureResourceError, true);

            const originalFetch = window.fetch;
            window.fetch = async (...args) => {
                try {
                    const response = await originalFetch(...args);
                    if (!response.ok) {
                        console.log('🚨 Fetch failed:', response.status, response.statusText, '-', args[0]);
                    }
                    return response;
                } catch (error) {
                    console.log('🚨 Fetch error:', args[0], error);
                    throw error;
                }
            };

            const probeResources = [
                'manifest.json',
                '/',
                'index.html',
                'css/style.css',
                'js/app.js',
                'js/app-views.js',
                'js/daily-deposit-engine.js',
                'images/icon-32.png',
                'images/icon-48.png',
                'images/icon-72.png',
                'images/icon-180.png',
                'images/icon-192.png',
                'images/icon-512.png',
                'images/smooth-paper-texture.jpg',
                'images/newspaper-sprites.png',
                'https://www.genspark.ai/api/files/s/5t2t8CLW',
                'https://i.postimg.cc/zBFYHrDy/Hollow.png'
            ];

            probeResources.forEach((path) => {
                originalFetch(path, { cache: 'no-store' })
                    .then((res) => console.log('🔍 Probe', path, res.status))
                    .catch((err) => console.log('🔍 Probe error', path, err));
            });
        })();
    </script>

    <!-- PWA Service Worker Registration with Auto-Update -->
    <script>
        // Force fresh service worker on every page load
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    // Unregister old SW first to ensure clean slate
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    
                    // Register with cache-busting
                    const registration = await navigator.serviceWorker.register('/service-worker.js?v=7', {
                        updateViaCache: 'none' // Never use cached SW
                    });
                    console.log('✅ Service Worker v7 registered:', registration.scope);
                    
                    // Force check for updates
                    registration.update();
                    
                    // Listen for new service worker
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        console.log('🔄 New Service Worker found, installing...');
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    // New content available
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    console.log('🆕 New version available! Refreshing...');
                                    window.location.reload();
                                } else {
                                    // First install
                                    console.log('📱 App ready for offline use');
                                }
                            }
                        });
                    });
                    
                    // If there's a waiting worker, activate it
                    if (registration.waiting) {
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                    
                } catch (error) {
                    console.log('❌ Service Worker registration failed:', error);
                }
            });
            
            // Listen for SW messages
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data.type === 'SW_ACTIVATED') {
                    console.log(`🚀 Service Worker v${event.data.version} now active!`);
                }
            });
            
            // Refresh when controller changes
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    console.log('🔄 Controller changed, refreshing...');
                    window.location.reload();
                }
            });
        }
        
        // Nuclear option - expose global function to force clear everything
        window.NUKE_CACHE = async () => {
            console.log('☢️ NUKING ALL CACHES...');
            // Clear all caches
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map(name => caches.delete(name)));
            // Unregister all service workers
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(reg => reg.unregister()));
            console.log('💥 All caches and SW nuked! Reloading...');
            window.location.reload(true);
        };
        
        console.log('💡 TIP: Run NUKE_CACHE() in console to force complete refresh');
    </script>
</body>
